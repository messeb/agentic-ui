# Full-stack demo: FastAPI backend + Nuxt frontend. The backend talks to a remote
# chat-completions API (OpenAI or Azure OpenAI) — set the vars in your shell or a `.env`
# file next to this compose:
#
#   OPENAI_API_KEY=sk-...  docker compose up --build
#
# Azure OpenAI: also set AZURE_OPENAI_ENDPOINT, OPENAI_API_VERSION, and DEMO_OPENAI_MODEL
# (your deployment name).
# Frontend http://localhost:3000 · Backend http://localhost:8000/docs
services:
  backend:
    build:
      context: ./backend
    image: agentic-ui-demo-backend
    environment:
      - DEMO_ENVIRONMENT=docker
      - 'DEMO_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]'
      # Chat-API-agnostic: set these in your shell or a .env file. OPENAI_BASE_URL is optional.
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - OPENAI_BASE_URL
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    image: agentic-ui-demo-frontend
    environment:
      # The browser (not the container) calls this, so it must be the host-mapped port.
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
