name: Dependabot auto-merge

# Auto-merges Dependabot PRs once the required CI checks pass.
# Covers every update type — patch, minor, major — and the GitHub Actions ("pipeline") updates.
#
# Note: GitHub does not allow the GITHUB_TOKEN to *approve* PRs, so this only enables auto-merge.
# Requires, in repo settings:
#   - Settings → General → "Allow auto-merge" enabled.
#   - A branch protection rule on `main` with the CI checks marked as required
#     (so `--auto` waits for them instead of merging immediately). If the rule also requires an
#     approving review, add a human/CODEOWNERS approval — Actions cannot self-approve.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
