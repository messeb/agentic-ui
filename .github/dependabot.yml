version: 2
updates:
  - package-ecosystem: uv
    directory: /demo/backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /demo/frontend
    schedule:
      interval: weekly
    groups:
      node:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /demo/backend
      - /demo/frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
