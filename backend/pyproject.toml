[project]
name = "agentic-ui-demo-backend"
version = "0.1.0"
description = "Standalone FastAPI backend scaffolding the 8 Agentic UI approaches as stub endpoints."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=2.50.0",
]

[project.scripts]
agentic-ui-demo = "agentic_ui_demo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_ui_demo"]

# The vendored manifest ships inside the package (keeps the app standalone).
[tool.hatch.build.targets.wheel.force-include]
"src/agentic_ui_demo/data/approaches.json" = "agentic_ui_demo/data/approaches.json"

# Standalone dev tooling (no workspace).
[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/agentic_ui_demo"]
